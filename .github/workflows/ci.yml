name: CI

on:
  push:
    # land/<sha>: the Hogherd farm's landing gate (scripts/land-gate.ps1) pushes a branch merged
    # with main there and lands it only when this run passes.
    branches: [main, 'land/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          swift --version
          echo "::notice::$(sw_vers -productVersion), $(swift --version 2>&1 | head -1)"

      # Compiler errors and warnings become annotations on the commit or pull request.
      - name: Build app bundle (ad-hoc signed)
        run: |
          set -o pipefail
          make app 2>&1 | tee build.log || {
            grep -E ": (error|warning): " build.log | sort -u | head -40 \
              | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (error|warning): (.*)$/::\4 file=\1,line=\2,col=\3::\5/'
            grep -E "^(error|make): " build.log | head -20 | sed 's/^/::error::/'
            exit 1
          }

      - name: Unit tests
        run: |
          set -o pipefail
          make test 2>&1 | tee test.log || {
            grep -E "(error|failed|Expectation failed)" test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

      # SwitcherViewTimingTests holds the Cmd-Tab switcher to SCOPE.md's budget with 60
      # windows; its timings go on the run as notices, passed or failed.
      - name: Switcher timing
        if: ${{ !cancelled() }}
        run: |
          grep -ho 'SwitcherView timing: .*' test.log | sed 's/^/::notice::/' || true

      - name: Check bundle
        run: |
          plutil -lint build/DockFlip.app/Contents/Info.plist
          codesign --verify --verbose build/DockFlip.app
          du -sh build/DockFlip.app
          # A fresh checkout is clean: its build must carry the bare commit, not -dirty.
          commit=$(/usr/libexec/PlistBuddy -c 'Print :DockFlipCommit' build/DockFlip.app/Contents/Info.plist)
          echo "::notice::DockFlipCommit $commit"
          case "$commit" in
            *-dirty|unknown|__COMMIT__) echo "::error::A clean checkout was built as commit '$commit'"; exit 1 ;;
          esac

      # Starts the app for real and holds it to SCOPE.md's budgets: first window on screen,
      # memory footprint, CPU at idle, and a clean quit on SIGTERM.
      - name: Launch check
        run: |
          swiftc -O scripts/launch-check.swift -o build/launch-check
          build/launch-check build/DockFlip.app

      - name: Launch check tests
        run: pwsh -NoProfile -File scripts/launch-check-tests.ps1

      - name: Landing gate tests
        run: pwsh -NoProfile -File scripts/land-gate-tests.ps1

      - name: Build commit tests
        run: pwsh -NoProfile -File scripts/build-commit-tests.ps1

      - name: Release workflow tests
        run: pwsh -NoProfile -File scripts/release-workflow-tests.ps1

      - name: Privacy docs tests
        run: pwsh -NoProfile -File scripts/privacy-docs-tests.ps1

      - name: Uninstall tests
        run: pwsh -NoProfile -File scripts/uninstall-tests.ps1
